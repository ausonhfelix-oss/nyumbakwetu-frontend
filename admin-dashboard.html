<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NyumbaKwetu</title>
    
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="stylesheet" href="landlord-dashboard.css">
    
    <style>
  /* ============================================
     MOBILE RESPONSIVE — Admin Dashboard
  ============================================ */
  @media (max-width: 768px) {

    /* FICHA SIDEBAR kabisa */
    .sidebar {
      display: none;
    }

    /* Dashboard container */
    .dashboard-container {
      display: block;
      padding: 0;
      margin: 0;
    }

    /* Main content — full width */
    .main-content {
      margin: 0;
      margin-bottom: 80px;
      padding: 15px;
      width: 100%;
    }

    /* Header sticky */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 999;
      background: white;
      padding: 12px 15px;
      flex-wrap: wrap;
    }

    .logo-area h1 {
      font-size: 18px;
    }

    .logo-area small {
      display: none;
    }

    /* Admin header */
    .admin-header {
      padding: 20px;
      margin-bottom: 15px;
    }

    .admin-header h1 {
      font-size: 20px;
    }

    .admin-header p {
      font-size: 13px;
    }

    /* Stats — column moja */
    .admin-stats {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .stat-card {
      padding: 15px;
    }

    .stat-card h3 {
      font-size: 26px;
    }

    /* Filters — wrap */
    .tab-filters {
      gap: 8px;
      margin-bottom: 15px;
    }

    .tab-filter {
      padding: 8px 15px;
      font-size: 13px;
    }

    /* Property card — column */
    .property-admin-card {
      flex-direction: column;
      padding: 15px;
      text-align: left;
      align-items: stretch;
    }

    .property-admin-card img {
      width: 100%;
      height: 150px;
    }

    .property-admin-info {
      min-width: unset;
      width: 100%;
    }

    .property-admin-info h3 {
      font-size: 16px;
    }

    .property-admin-actions {
      display: flex;
      flex-direction: row;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }

    .btn-thibitisha,
    .btn-futa {
      flex: 1;
      padding: 12px 10px;
      font-size: 13px;
      text-align: center;
    }
  }
</style>
    <style>
        .admin-header {
            background: linear-gradient(135deg, #1a5c2e 0%, #2d8a4a 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 32px;
            color: #1a5c2e;
            margin: 10px 0;
        }
        
        .stat-card p {
            color: #666;
            font-size: 14px;
        }
        
        .property-admin-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .property-admin-card img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .property-admin-info {
            flex: 1;
            min-width: 200px;
        }
        
        .property-admin-info h3 {
            margin: 0 0 6px 0;
            color: #1a5c2e;
        }
        
        .property-admin-info p {
            margin: 3px 0;
            color: #666;
            font-size: 14px;
        }
        
        .property-admin-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn-thibitisha {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .btn-thibitisha:hover {
            background: #14532d;
        }
        
        .btn-futa {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .btn-futa:hover {
            background: #991b1b;
        }
        
        .badge-hali {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        
        .badge-pending { background: #f59e0b; }
        .badge-live { background: #16a34a; }
        
        .tab-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-filter {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
        }
        
        .tab-filter.active {
            background: #1a5c2e;
            color: white;
            border-color: #1a5c2e;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="logo-area">
        <i class="fa-solid fa-house-chimney logo-icon"></i>
        <div>
            <h1>Nyumba<span>Kwetu</span></h1>
            <small>Admin Panel</small>
        </div>
    </div>
    <div class="header-right">
        <div class="account-top">
            <div class="profile-circle">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <strong id="adminJina">Admin</strong>
                <small>Administrator</small>
            </div>
        </div>
    </div>
</header>


<div class="dashboard-container">

    <aside class="sidebar">
        <div class="sidebar-profile">
            <div class="big-profile">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <strong>Admin</strong>
                <p>Msimamizi</p>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                <span>Rudi Nyumbani</span>
            </a>
            <a href="#" class="active">
                <i class="fa-solid fa-grip"></i>
                <span>Dashibodi</span>
            </a>
            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Toka (Logout)</span>
            </a>
        </nav>
    </aside>


    <main class="main-content">

        <div class="admin-header">
            <h1 style="margin: 0;">Karibu, Admin!</h1>
            <p style="margin: 10px 0 0 0; opacity: 0.9;">
                Simamia nyumba zote za NyumbaKwetu
            </p>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <i class="fa-solid fa-clock" style="font-size: 24px; color: #f59e0b;"></i>
                <h3 id="statPending">0</h3>
                <p>Zinasubiri Uthibitisho</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-check-circle" style="font-size: 24px; color: #16a34a;"></i>
                <h3 id="statLive">0</h3>
                <p>Nyumba Live</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-house" style="font-size: 24px; color: #1a5c2e;"></i>
                <h3 id="statTotal">0</h3>
                <p>Jumla ya Nyumba</p>
            </div>
        </div>

        <div class="tab-filters">
            <button class="tab-filter active" data-filter="all">Zote</button>
            <button class="tab-filter" data-filter="Pending">Zinasubiri</button>
            <button class="tab-filter" data-filter="Live">Live</button>
        </div>

        <div id="orodhaYaNyumbaAdmin">
            <p style="text-align: center; padding: 40px; color: #888;">
                Inapakia nyumba...
            </p>
        </div>

    </main>
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="bottom-nav">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>Nyumbani</span>
  </a>

  <a href="index.html#searchBox">
    <i class="fa-solid fa-magnifying-glass"></i>
    <span>Tafuta</span>
  </a>

  <a href="admin-dashboard.html" class="bottom-active">
    <i class="fa-solid fa-grip"></i>
    <span>Dashibodi</span>
  </a>

  <a href="#" id="logoutBtnMobile">
    <i class="fa-solid fa-arrow-right-from-bracket"></i>
    <span>Toka</span>
  </a>

</nav>
<script src="admin-dashboard.js"></script>

</body>
</html>
