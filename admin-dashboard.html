<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NyumbaKwetu</title>
    
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="stylesheet" href="landlord-dashboard.css">
    <link rel="stylesheet" href="admin-dashboard.css">

</head>

<body>

<header class="top-header">
    <div class="logo-area">
        <i class="fa-solid fa-house-chimney logo-icon"></i>
        <div>
            <h1>Nyumba<span>Kwetu</span></h1>
            <small>Admin Panel</small>
        </div>
    </div>
    <div class="header-right">
        <div class="account-top">
            <div class="profile-circle">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <strong id="adminJina">Admin</strong>
                <small>Administrator</small>
            </div>
        </div>
    </div>
</header>


<div class="dashboard-container">

    <aside class="sidebar">
        <div class="sidebar-profile">
            <div class="big-profile">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <strong>Admin</strong>
                <p>Msimamizi</p>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                <span>Rudi Nyumbani</span>
            </a>
            <a href="#" class="active">
                <i class="fa-solid fa-grip"></i>
                <span>Dashibodi</span>
            </a>
            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Toka (Logout)</span>
            </a>
        </nav>
    </aside>


    <main class="main-content">

        <div class="admin-header">
            <h1 style="margin: 0;">Karibu, Admin!</h1>
            <p style="margin: 10px 0 0 0; opacity: 0.9;">
                Simamia nyumba zote za NyumbaKwetu
            </p>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <i class="fa-solid fa-clock" style="font-size: 24px; color: #f59e0b;"></i>
                <h3 id="statPending">0</h3>
                <p>Zinasubiri Uthibitisho</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-check-circle" style="font-size: 24px; color: #16a34a;"></i>
                <h3 id="statLive">0</h3>
                <p>Nyumba Live</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-house" style="font-size: 24px; color: #1a5c2e;"></i>
                <h3 id="statTotal">0</h3>
                <p>Jumla ya Nyumba</p>
            </div>
        </div>

        <div class="tab-filters">
            <button class="tab-filter active" data-filter="all">Zote</button>
            <button class="tab-filter" data-filter="Pending">Zinasubiri</button>
            <button class="tab-filter" data-filter="Live">Live</button>
        </div>

        <div id="orodhaYaNyumbaAdmin">
            <p style="text-align: center; padding: 40px; color: #888;">
                Inapakia nyumba...
            </p>
        </div>

    </main>
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="bottom-nav">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>Nyumbani</span>
  </a>

  <a href="index.html#searchBox">
    <i class="fa-solid fa-magnifying-glass"></i>
    <span>Tafuta</span>
  </a>

  <a href="admin-dashboard.html" class="bottom-active">
    <i class="fa-solid fa-grip"></i>
    <span>Dashibodi</span>
  </a>

  <a href="#" id="logoutBtnMobile">
    <i class="fa-solid fa-arrow-right-from-bracket"></i>
    <span>Toka</span>
  </a>

</nav>

<script src="admin-dashboard.js"></script>

</body>
</html>
