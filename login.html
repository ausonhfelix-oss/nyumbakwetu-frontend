<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingia - NyumbaKwetu</title>
    
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    
    <!-- LEFT SIDE - BRANDING -->
    <div class="auth-left">
        <div class="brand">
            <i class="fa-solid fa-house-chimney"></i>
            <h1>Nyumba<span>Kwetu</span></h1>
            <p>Nyumba bora, maisha bora</p>
        </div>
        
        <div class="auth-features">
            <div class="feature">
                <i class="fa-solid fa-check-circle"></i>
                <span>Karibu tena!</span>
            </div>
            <div class="feature">
                <i class="fa-solid fa-check-circle"></i>
                <span>Endelea kutafuta nyumba yako</span>
            </div>
        </div>
    </div>
    
    
    <!-- RIGHT SIDE - FORM -->
    <div class="auth-right">
        
        <div class="auth-header">
            <h2>Karibu Tena</h2>
            <p>Ingia kwenye akaunti yako</p>
        </div>
        
        <form <!--id="loginForm"<>
            
            <div class="form-group">
                <label>Email</label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Weka email yako" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Weka password yako" required>
                </div>
            </div>
            
            <button type="submit" class="auth-button">
                <i class="fa-solid fa-right-to-bracket"></i>
                Ingia
            </button>
            
            <div class="message" id="message"></div>
            
        </form>
        
        <div class="auth-footer">
            <p>Hauna akaunti? <a href="signup.html">Jisajili hapa</a></p>
        </div>
        
    </div>
    
</div>

<script src="auth.js"></script>
</body>
</html>
