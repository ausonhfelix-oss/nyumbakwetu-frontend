<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilizohifadhiwa - NyumbaKwetu</title>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header class="main-header">
    <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house-chimney"></i></div>
        <div>
            <h1>Nyumba<span>Kwetu</span></h1>
            <p>Nyumba bora, maisha bora</p>
        </div>
    </div>
    <div class="header-actions">
        <div class="user-account" id="headerAkaunti">
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
            <span id="jinaLaMtumiaji">Ingia</span>
        </div>
    </div>
</header>

<section class="section">
    <div class="section-heading">
        <h2>NYUMBA ULIZOHIFADHI</h2>
        <a href="index.html">Rudi nyumbani <i class="fa-solid fa-chevron-right"></i></a>
    </div>

    <div class="property-list" id="orodhaYaNyumba"></div>
</section>

<nav class="mobile-bottom-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i><span>Nyumbani</span></a>
    <a href="index.html#tafuta"><i class="fa-solid fa-magnifying-glass"></i><span>Tafuta</span></a>
    <a href="landlord-dashboard.html" class="add-button"><i class="fa-solid fa-plus"></i><span>Weka Nyumba</span></a>
    <a href="zilizohifadhiwa.html" class="active-"><i class="fa-regular fa-heart"></i><span>Zilizohifadhiwa</span></a>
    <a href="#" id="navAkaunti"><i class="fa-regular fa-user"></i><span>Akaunti</span></a>
</nav>

<script>
var API_URL = "https://nyumbakwetu-backend.vercel.app/api";
var propertyList = document.getElementById("orodhaYaNyumba");

// HEADER
var mtumiajiStr = localStorage.getItem("mtumiaji");
if (mtumiajiStr) {
    try {
        var m = JSON.parse(mtumiajiStr);
        document.getElementById("jinaLaMtumiaji").textContent = m.jina || "Mtumiaji";
    } catch(e){}
}

document.getElementById("headerAkaunti").addEventListener("click", function () {
    var s = localStorage.getItem("mtumiaji");
    if (!s) {
        localStorage.setItem("baadaYaLogin", window.location.href);
        window.location.href = "login.html";
        return;
    }
    var m = JSON.parse(s);
    if (m.aina === "admin") window.location.href = "admin-dashboard.html";
    else if (m.aina === "landlord") window.location.href = "landlord-dashboard.html";
    else window.location.href = "tenant-dashboard.html";
});

document.getElementById("navAkaunti").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("headerAkaunti").click();
});

// PAKUA ZOTE, KISHA CHUJA ZILIZOHIFADHIWA
async function pakuaZilizohifadhiwa() {
    var favIds = JSON.parse(localStorage.getItem("nyumbaFavorites") || "[]");

    if (favIds.length === 0) {
        propertyList.innerHTML =
            '<p style="text-align:center;padding:40px;color:#888;">' +
            'Hujahifadhi nyumba yoyote bado.<br>' +
            '<a href="index.html" style="color:#e63946;">Nenda uangalie nyumba</a>' +
            '</p>';
        return;
    }

    try {
        var res = await fetch(API_URL + "/properties");
        var data = await res.json();
        var zote = data.nyumba || [];
        var zangu = zote.filter(function(n) {
            return favIds.indexOf(n._id) !== -1;
        });
        onyeshaNyumba(zangu);
    } catch (e) {
        propertyList.innerHTML = '<p style="color:red;text-align:center;padding:40px;">Imeshindikana kupata nyumba.</p>';
    }
}

function onyeshaNyumba(nyumba) {
    propertyList.innerHTML = "";
    for (var j = 0; j < nyumba.length; j++) {
        var n = nyumba[j];
        var id = n._id;
        var picha = (n.picha && n.picha.length) ? n.picha[0] : "Images/house1.jpg";
        var bei = "TZS " + n.bei.toLocaleString();
        if (n.lengo !== "kuuza") bei += " / mwezi";

        var card = document.createElement("article");
        card.className = "property-card";
        card.onclick = (function(cid) {
            return function() {
                window.location.href = "property-details.html?id=" + cid;
            };
        })(id);

        card.innerHTML =
            '<div class="property-image">' +
                '<img src="' + picha + '" alt="' + n.jina + '">' +
            '</div>' +
            '<div class="property-info">' +
                '<h3>' + n.jina + '</h3>' +
                '<p class="property-location"><i class="fa-solid fa-location-dot"></i> ' +
                    (n.eneo || "") + ', ' + (n.mkoa || "") + '</p>' +
                '<strong class="property-price">' + bei + '</strong>' +
            '</div>';

        propertyList.appendChild(card);
    }
}

pakuaZilizohifadhiwa();
</script>
</body>
</html>
