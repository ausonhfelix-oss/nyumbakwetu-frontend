<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jisajili - NyumbaKwetu</title>
    
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    
    <!-- LEFT SIDE - BRANDING -->
    <div class="auth-left">
        <div class="brand">
            <i class="fa-solid fa-house-chimney"></i>
            <h1>Nyumba<span>Kwetu</span></h1>
            <p>Nyumba bora, maisha bora</p>
        </div>
        
        <div class="auth-features">
            <div class="feature">
                <i class="fa-solid fa-check-circle"></i>
                <span>Pata nyumba za kupanga na kuuza</span>
            </div>
            <div class="feature">
                <i class="fa-solid fa-check-circle"></i>
                <span>Wasiliana na wamiliki moja kwa moja</span>
            </div>
            <div class="feature">
                <i class="fa-solid fa-check-circle"></i>
                <span>Hifadhi nyumba unazozipenda</span>
            </div>
        </div>
    </div>
    
    
    <!-- RIGHT SIDE - FORM -->
    <div class="auth-right">
        
        <div class="auth-header">
            <h2>Karibu NyumbaKwetu</h2>
            <p>Jisajili kuanza kutumia huduma zetu</p>
        </div>
        
        <form id="signupForm">
            
            <div class="form-group">
                <label>Jina Kamili</label>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="jina" placeholder="Mfano: Ausonius Helmani" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Mfano: ausonius@test.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Namba ya Simu</label>
                <div class="input-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="simu" placeholder="Mfano: 0712345678" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Weka password (min 6)" required minlength="6">
                </div>
            </div>
            
            <div class="form-group">
                <label>Nini Unatafuta?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="aina" value="tenant" checked>
                        <span>Kupanga Nyumba (Tenant)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="aina" value="landlord">
                        <span>Kupangisha Nyumba (Landlord)</span>
                    </label>
                </div>
            </div>
            
            <button type="submit" class="auth-button">
                <i class="fa-solid fa-user-plus"></i>
                Jisajili
            </button>
            
            <div class="message" id="message"></div>
            
        </form>
        
        <div class="auth-footer">
            <p>Una akaunti? <a href="login.html">Ingia hapa</a></p>
        </div>
        
    </div>
    
</div>

<script src="auth.js"></script>
</body>
</html>
